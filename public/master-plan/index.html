    function emptyFc() {
      return { type: 'FeatureCollection', features: [] };
    }

    function buildDrawCollections(points) {
      const pts = {
        type: 'FeatureCollection',
        features: points.map((coord, i) => ({
          type: 'Feature',
          properties: { i },
          geometry: { type: 'Point', coordinates: coord }
        }))
      };

      const lineCoords = points.length >= 2 ? [...points] : [];
      // While editing with 2+ points, also show close-to-first preview when >= 3
      const line = {
        type: 'FeatureCollection',
        features: lineCoords.length
          ? [{
              type: 'Feature',
              properties: {},
              geometry: {
                type: 'LineString',
                coordinates: points.length >= 3 ? [...points, points[0]] : lineCoords
              }
            }]
          : []
      };

      const poly = {
        type: 'FeatureCollection',
        features: []
      };
      if (points.length >= 3) {
        const ring = [...points, points[0]];
        poly.features.push({
          type: 'Feature',
          properties: {},
          geometry: { type: 'Polygon', coordinates: [ring] }
        });
      }

      return { pts, line, poly };
    }

    function clearEditHandles() {
      while (vertexMarkers.length) vertexMarkers.pop().remove();
      while (midpointMarkers.length) midpointMarkers.pop().remove();
    }

    function rebuildEditHandles() {
      clearEditHandles();
      if (!boundaryDrawMode) return;

      boundaryVertices.forEach((coord, index) => {
        const el = document.createElement('div');
        el.className = 'boundary-vertex-handle';
        el.title = `Corner ${index + 1} — drag to reshape`;
        const marker = new maplibregl.Marker({ element: el, draggable: true, anchor: 'center' })
          .setLngLat(coord)
          .addTo(map);

        marker.on('drag', () => {
          const ll = marker.getLngLat();
          boundaryVertices[index] = [ll.lng, ll.lat];
          refreshBoundaryDrawLayers(false);
          // Keep midpoints in sync without rebuilding this vertex mid-drag
          syncMidpointPositions();
        });
        marker.on('dragend', () => {
          const ll = marker.getLngLat();
          boundaryVertices[index] = [ll.lng, ll.lat];
          refreshBoundaryDrawLayers(true);
          suppressNextMapClick = true;
        });
        el.addEventListener('click', (ev) => {
          ev.stopPropagation();
          suppressNextMapClick = true;
        });
        vertexMarkers.push(marker);
      });

      // Midpoints on each straight segment — click to insert a bend point
      if (boundaryVertices.length >= 2) {
        const edgeCount = boundaryVertices.length >= 3
          ? boundaryVertices.length // include closing edge
          : boundaryVertices.length - 1;

        for (let i = 0; i < edgeCount; i++) {
          const a = boundaryVertices[i];
          const b = boundaryVertices[(i + 1) % boundaryVertices.length];
          if (boundaryVertices.length < 3 && i === boundaryVertices.length - 1) break;
          const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
          const el = document.createElement('div');
          el.className = 'boundary-midpoint-handle';
          el.title = 'Click to add bend point, then drag';
          const marker = new maplibregl.Marker({ element: el, draggable: true, anchor: 'center' })
            .setLngLat(mid)
            .addTo(map);

          const insertAt = i + 1;
          const promoteToVertex = (lngLat) => {
            boundaryVertices.splice(insertAt, 0, [lngLat.lng, lngLat.lat]);
            refreshBoundaryDrawLayers(true);
            suppressNextMapClick = true;
            statusEl.style.display = 'block';
            statusEl.textContent = `Bend point added (${boundaryVertices.length} corners). Drag yellow handles to reshape.`;
          };

          el.addEventListener('click', (ev) => {
            ev.stopPropagation();
            ev.preventDefault();
            const ll = marker.getLngLat();
            promoteToVertex(ll);
          });
          marker.on('dragstart', () => {
            suppressNextMapClick = true;
          });
          marker.on('dragend', () => {
            const ll = marker.getLngLat();
            promoteToVertex(ll);
          });
          midpointMarkers.push(marker);
        }
      }
    }

    function syncMidpointPositions() {
      if (!midpointMarkers.length || boundaryVertices.length < 2) return;
      const edgeCount = boundaryVertices.length >= 3
        ? boundaryVertices.length
        : boundaryVertices.length - 1;
      for (let i = 0; i < midpointMarkers.length && i < edgeCount; i++) {
        const a = boundaryVertices[i];
        const b = boundaryVertices[(i + 1) % boundaryVertices.length];
        midpointMarkers[i].setLngLat([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]);
      }
    }

    function refreshBoundaryDrawLayers(rebuildHandles = true) {
      if (!map.getSource('boundary-draw-points')) return;
      const { pts, line, poly } = buildDrawCollections(boundaryVertices);
      map.getSource('boundary-draw-points').setData(pts);
      map.getSource('boundary-draw-line').setData(line);
      map.getSource('boundary-draw-fill').setData(poly);
      boundaryPointCountEl.textContent = String(boundaryVertices.length);
      finishBoundaryBtn.disabled = boundaryVertices.length < 3;
      clearBoundaryBtn.disabled = boundaryVertices.length === 0 && !boundaryDrawMode;
      if (rebuildHandles) rebuildEditHandles();
    }

    function ensureBoundaryDrawLayers() {
      if (map.getSource('boundary-draw-points')) return;

      // Free Esri imagery raster — temporary overlay (not Mapbox/MapTiler)
      if (!map.getSource('dev-satellite')) {
        map.addSource('dev-satellite', {
          type: 'raster',
          tiles: [
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
          ],
          tileSize: 256,
          attribution: 'Tiles © Esri'
        });
        // Place satellite under labels/UI layers but above basemap fills when possible
        const beforeId = map.getLayer('property-boundary-fill')
          ? 'property-boundary-fill'
          : (map.getLayer('sale-fill') ? 'sale-fill' : undefined);
        map.addLayer({
          id: 'dev-satellite',
          type: 'raster',
          source: 'dev-satellite',
          layout: { visibility: 'visible' },
          paint: { 'raster-opacity': 1 }
        }, beforeId);
      }

      map.addSource('boundary-draw-fill', { type: 'geojson', data: emptyFc() });
      map.addSource('boundary-draw-line', { type: 'geojson', data: emptyFc() });
      map.addSource('boundary-draw-points', { type: 'geojson', data: emptyFc() });

      map.addLayer({
        id: 'boundary-draw-fill',
        type: 'fill',
        source: 'boundary-draw-fill',
        paint: {
          'fill-color': '#facc15',
          'fill-opacity': 0.22
        }
      });
      map.addLayer({
        id: 'boundary-draw-line',
        type: 'line',
        source: 'boundary-draw-line',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#facc15',
          'line-width': 3,
          'line-opacity': 1
        }
      });
      map.addLayer({
        id: 'boundary-draw-points',
        type: 'circle',
        source: 'boundary-draw-points',
        paint: {
          'circle-radius': 5,
          'circle-color': '#fef08a',
          'circle-stroke-color': '#111',
          'circle-stroke-width': 2
        }
      });
    }

    function setSatelliteVisible(on) {
      satelliteOn = on;
      ensureBoundaryDrawLayers();
      if (map.getLayer('dev-satellite')) {
        map.setLayoutProperty('dev-satellite', 'visibility', on ? 'visible' : 'none');
      }
      satelliteToggleBtn.textContent = on ? 'Satellite ON' : 'Satellite OFF';
      satelliteToggleBtn.classList.toggle('active', on);
    }

    function setBoundaryDrawMode(on) {
      ensureBoundaryDrawLayers();
      boundaryDrawMode = on;
      document.body.classList.toggle('is-drawing-boundary', on);
      if (drawBoundaryBtn) {
        drawBoundaryBtn.classList.toggle('active', on);
        drawBoundaryBtn.textContent = on ? 'Editing boundary…' : 'Draw Boundary';
      }
      if (boundaryDrawMeta) boundaryDrawMeta.hidden = !on && boundaryVertices.length === 0;
      if (on) {
        if (penPickMode) setPenPickMode(false);
        setSatelliteVisible(true);
        statusEl.style.display = 'block';
        statusEl.textContent =
          'Click to add corners. White dots on a line = click to bend. Drag yellow dots to reshape.';
      } else {
        clearEditHandles();
        if (boundaryVertices.length === 0) statusEl.style.display = 'none';
      }
      refreshBoundaryDrawLayers(true);
    }

    function clearBoundaryDrawing() {
      boundaryVertices = [];
      clearEditHandles();
      refreshBoundaryDrawLayers(true);
      boundaryDrawMeta.hidden = !boundaryDrawMode;
      statusEl.style.display = 'block';
      statusEl.textContent = 'Boundary cleared — click to place corners again.';
      setTimeout(() => {
        if (!boundaryDrawMode) statusEl.style.display = 'none';
      }, 2200);
    }

    function downloadBoundaryGeoJSON() {
      if (boundaryVertices.length < 3) {
        statusEl.style.display = 'block';
        statusEl.textContent = 'Need at least 3 points to finish the boundary.';
        return;
      }

      const ring = boundaryVertices.map((pt) => [pt[0], pt[1]]);
      const first = ring[0];
      const last = ring[ring.length - 1];
      if (first[0] !== last[0] || first[1] !== last[1]) {
        ring.push([first[0], first[1]]);
      }

      const geojson = {
        type: 'FeatureCollection',
        features: [
          {
            type: 'Feature',
            properties: {
              id: 'sark-green-plains',
              name: 'Sark Green Plains'
            },
            geometry: {
              type: 'Polygon',
              coordinates: [ring]
            }
          }
        ]
      };

      const blob = new Blob([JSON.stringify(geojson, null, 2)], {
        type: 'application/geo+json'
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sark-property.geojson';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      statusEl.style.display = 'block';
      statusEl.textContent =
        `Downloaded sark-property.geojson (${boundaryVertices.length} vertices). Import into property1.json boundary next.`;
      setBoundaryDrawMode(false);
    }

    function onBoundaryDrawClick(e) {
      if (!boundaryDrawMode) return;
      if (suppressNextMapClick) {
        suppressNextMapClick = false;
        return;
      }
      // Don't add a point when clicking UI / handles
      if (e.originalEvent?.target?.closest?.(
        '.boundary-draw-wrap, .layout-toggle-wrap, .coord-pick-panel, .plot-panel, .timeline-bar, .maplibregl-ctrl, .boundary-vertex-handle, .boundary-midpoint-handle'
      )) {
        return;
      }
      boundaryVertices.push([e.lngLat.lng, e.lngLat.lat]);
      boundaryDrawMeta.hidden = false;
      refreshBoundaryDrawLayers(true);
    }

    drawBoundaryBtn?.addEventListener('click', () => {
      setBoundaryDrawMode(!boundaryDrawMode);
    });
    satelliteToggleBtn?.addEventListener('click', () => {
      ensureBoundaryDrawLayers();
      setSatelliteVisible(!satelliteOn);
    });
    finishBoundaryBtn?.addEventListener('click', downloadBoundaryGeoJSON);
    clearBoundaryBtn?.addEventListener('click', clearBoundaryDrawing);

    map.on('click', onBoundaryDrawClick);

    async function waitForGltfLoader(timeoutMs = 15000) {
      if (window.createModelBuildingsLayer) return true;
      return new Promise((resolve) => {
        const t = setTimeout(() => resolve(false), timeoutMs);
        window.addEventListener('gltf-ready', () => {
          clearTimeout(t);
          resolve(true);
        }, { once: true });
      });
    }

    map.on('load', async () => {
      statusEl.style.display = 'block';
      statusEl.textContent = IS_LIGHT_THEME
        ? 'Loading Sark Green Plains layout…'
        : 'Loading local GLB/GLTF icons on black map…';

      addLayers();
      ensureBoundaryDrawLayers();
      setSatelliteVisible(!IS_LIGHT_THEME);
      notifyParentReady();

      const ok = await waitForGltfLoader();
      if (!ok || !window.createModelBuildingsLayer) {
        statusEl.textContent = 'Map ready. Icons failed — check Three.js CDN or open via localhost.';
        notifyParentReady();
        return;
      }

      try {
        gltfLayer = await window.createModelBuildingsLayer(maplibregl, modelPlacements);
        map.addLayer(gltfLayer);
        gltfLayer.setYear(currentYear);
        if (activeDest) gltfLayer.focus(activeDest);

        if (gltfLayer.whenReady) {
          gltfLayer.whenReady().then(() => {
            statusEl.textContent = 'Large 3D icons ready.';
            setTimeout(() => { statusEl.style.display = 'none'; }, 2800);
            notifyParentReady();
          });
        } else {
          notifyParentReady();
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Icon load error — see console.';
        notifyParentReady();
      }
    });
    map.on('error', (e) => {
      console.error(e);
    });
  </script>
</body>
</html>
